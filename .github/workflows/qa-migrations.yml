name: QA - Protected Migrations

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full SHA at the exact remote branch head to migrate
        required: true
        type: string
      branch:
        description: Remote branch whose head must equal commit_sha
        required: true
        default: qa
        type: string
      qa_origin:
        description: Exact protected QA deployment origin
        required: true
        default: https://travle-buddy-git-qa-gbw30s-projects.vercel.app
        type: string
      database_fingerprint:
        description: Exact credential-free QA database SHA-256 fingerprint
        required: true
        default: e6d10d0c10e8212e11f6c88d6e4747fd281edf273a592283bad6ae6a8f380586
        type: string
      migration_head:
        description: Exact final migration directory expected at repository HEAD
        required: true
        default: 20260723120000_stage0_planning_mutation_fingerprint
        type: string
      confirmation:
        description: Type MIGRATE QA <database_fingerprint> TO <migration_head>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qa-protected-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact QA migration head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa-migrations

    env:
      QA_TARGET: preview
      QA_BASE_URL: ${{ inputs.qa_origin }}
      QA_RUN_ID: qa-migration-${{ github.run_id }}-${{ github.run_attempt }}
      QA_ALLOW_WRITES: "true"
      QA_DATABASE_FINGERPRINT: ${{ inputs.database_fingerprint }}
      QA_MIGRATION_EXPECTED_ORIGIN: https://travle-buddy-git-qa-gbw30s-projects.vercel.app
      QA_MIGRATION_EXPECTED_DATABASE_FINGERPRINT: e6d10d0c10e8212e11f6c88d6e4747fd281edf273a592283bad6ae6a8f380586
      QA_MIGRATION_COMMIT_SHA: ${{ inputs.commit_sha }}
      QA_MIGRATION_BRANCH: ${{ inputs.branch }}
      QA_MIGRATION_HEAD: ${{ inputs.migration_head }}
      QA_MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout exact requested commit without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Preflight exact commit, branch, origin, database, and migration head
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
          QA_PRODUCTION_DATABASE_FINGERPRINT: ${{ secrets.PRODUCTION_DATABASE_FINGERPRINT }}
        run: npm run qa:migrate:preflight

      - name: Record sanitized pre-deploy migration status
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
        shell: bash
        run: |
          mkdir -p qa-results/qa-migration
          set +e
          npm run prisma:status > qa-results/qa-migration/status-pre.raw 2>&1
          code=$?
          npm run qa:sanitize-log -- qa-results/qa-migration/status-pre.raw qa-results/qa-migration/status-pre.log
          rm qa-results/qa-migration/status-pre.raw
          echo "Pre-deploy status exit code: $code" >> qa-results/qa-migration/status-pre.log

      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
        shell: bash
        run: |
          set +e
          npm run db:deploy > qa-results/qa-migration/deploy.raw 2>&1
          code=$?
          npm run qa:sanitize-log -- qa-results/qa-migration/deploy.raw qa-results/qa-migration/deploy.log
          rm qa-results/qa-migration/deploy.raw
          exit "$code"

      - name: Verify post-deploy ledger receipt
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
          QA_PRODUCTION_DATABASE_FINGERPRINT: ${{ secrets.PRODUCTION_DATABASE_FINGERPRINT }}
        run: npm run qa:migrate:postflight

      - name: Verify post-deploy migration status
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
        shell: bash
        run: |
          set +e
          npm run prisma:status > qa-results/qa-migration/status-post.raw 2>&1
          code=$?
          npm run qa:sanitize-log -- qa-results/qa-migration/status-post.raw qa-results/qa-migration/status-post.log
          rm qa-results/qa-migration/status-post.raw
          exit "$code"

      - name: Verify deployed schema has no diff
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
        shell: bash
        run: |
          set +e
          npm run qa:migrate:diff > qa-results/qa-migration/schema-diff.raw 2>&1
          code=$?
          npm run qa:sanitize-log -- qa-results/qa-migration/schema-diff.raw qa-results/qa-migration/schema-diff.log
          rm qa-results/qa-migration/schema-diff.raw
          exit "$code"

      - name: Publish sanitized migration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-results/qa-migration/*.json
            qa-results/qa-migration/*.log
          if-no-files-found: error
          retention-days: 90
