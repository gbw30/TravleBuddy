name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://travlebuddy:ci-only@127.0.0.1:5432/travlebuddy_ci
      DIRECT_URL: postgresql://travlebuddy:ci-only@127.0.0.1:5432/travlebuddy_ci
      AUTH_SECRET: travlebuddy-ci-auth-secret-at-least-32-characters
      AUTH_URL: http://localhost:3000
      AUTH_GOOGLE_ID: ci-google-client-id
      AUTH_GOOGLE_SECRET: ci-google-client-secret
      NEXTAUTH_SECRET: travlebuddy-ci-auth-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      PLACE_PROVIDER_MODE: mock
      QA_PROVIDER_MODE: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
