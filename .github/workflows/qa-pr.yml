name: QA - Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify
        required: true
        type: number
      base_sha:
        description: Optional base commit for selective QA routing
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: qa-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic QA gate
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'qa-required' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travlebuddy
          POSTGRES_PASSWORD: travlebuddy_ci
          POSTGRES_DB: travlebuddy_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travlebuddy -d travlebuddy_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      DATABASE_URL: postgresql://travlebuddy:travlebuddy_ci@127.0.0.1:5432/travlebuddy_qa
      DIRECT_URL: postgresql://travlebuddy:travlebuddy_ci@127.0.0.1:5432/travlebuddy_qa
      AUTH_SECRET: travlebuddy-ci-auth-secret-at-least-32-characters
      AUTH_URL: http://127.0.0.1:3000
      AUTH_GOOGLE_ID: qa-google-client-id
      AUTH_GOOGLE_SECRET: qa-google-client-secret
      QA_TARGET: local
      QA_BASE_URL: http://127.0.0.1:3000
      QA_RUN_ID: pr-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
      QA_ALLOW_WRITES: "true"
      QA_PROVIDER_MODE: mock
      QA_RUN_TYPE: pr
      QA_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      QA_PARENT_SANDBOX: read-only

    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Derive disposable database fingerprint
        shell: bash
        run: |
          fingerprint="$(npm run --silent qa:fingerprint)"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "qa:fingerprint did not return a SHA-256 hex digest" >&2
            exit 1
          fi
          echo "QA_DATABASE_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Provision disposable database schema
        run: npm run db:deploy

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deterministic PR gate
        run: npm run qa:gate

      - name: Generate risk-routed QA context
        if: always()
        run: npm run qa:context

      - name: Write deterministic summary
        if: always()
        shell: bash
        run: |
          {
            echo "### TravleBuddy deterministic PR QA"
            echo
            echo "- Run ID: \`$QA_RUN_ID\`"
            echo "- Target: \`$QA_TARGET\`"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Provider mode: mock"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-pr-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_id }}
          path: |
            qa-results/**
            playwright-report/**
            test-results/**
            coverage/**
          if-no-files-found: warn
          retention-days: 14

  codex-risk-review:
    name: Codex read-only change-risk review
    needs: deterministic
    if: ${{ always() && needs.deterministic.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'qa-required')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: qa-pr-agent
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}

    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Download deterministic QA evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: qa-pr-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_id }}
          path: qa-input

      - name: Block when the protected Codex credential is unavailable
        if: env.HAS_OPENAI_API_KEY != 'true'
        shell: bash
        run: |
          {
            echo "### Codex PR risk review"
            echo
            echo "VERDICT: BLOCKED"
            echo "The protected OPENAI_API_KEY prerequisite is not configured."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Run Codex risk review
        id: codex
        if: env.HAS_OPENAI_API_KEY == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/pr-risk-review.md
          output-file: codex-pr-risk-review.md
          codex-args: '["--ephemeral"]'
          sandbox: read-only
          safety-strategy: drop-sudo

      - name: Publish and enforce Codex verdict
        if: steps.codex.outcome == 'success'
        shell: bash
        run: |
          cat codex-pr-risk-review.md >> "$GITHUB_STEP_SUMMARY"
          verdict="$(sed -n 's/^VERDICT: \(PASS\|FAIL\|BLOCKED\)$/\1/p' codex-pr-risk-review.md | head -n 1)"
          case "$verdict" in
            PASS) exit 0 ;;
            FAIL|BLOCKED) exit 1 ;;
            *) echo "Codex output omitted a valid verdict" >&2; exit 1 ;;
          esac

      - name: Upload Codex review
        if: always() && env.HAS_OPENAI_API_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-pr-risk-review-${{ github.run_id }}
          path: codex-pr-risk-review.md
          if-no-files-found: warn
          retention-days: 14
